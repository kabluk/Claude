      .group { margin-bottom: 22px; }
      a {
        display: block; background: #1c2126; border-left: 3px solid #37a05a;
        color: #edeff1; text-decoration: none; padding: 15px 16px;
        font-size: 15.5px; font-weight: 600; margin-top: 9px;
      }
