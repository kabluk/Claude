name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Дожинаем UX-пробел: сайт, продающий аудиты доступности, обязан проходить
      # свои же стандарты (domains/qa.md, ROADMAP.md Фаза 1). CI-раннер без
      # /opt/pw-browsers — ставим Chromium явно, без хардкода пути (только тут).
      # Перенесено ПЕРЕД worker:test (2026-08-06, A3-REFLOW/KEYBOARD/MEDIA/RESIZE/
      # COOKIEBANNER): worker/lib/domChecks.test.mjs тоже гоняет реальный Chromium
      # (не мок) — без этого шага перед worker:test тесты падали бы в CI с "Executable
      # doesn't exist", хотя проходили локально (браузер уже стоял в песочнице).
      - run: npx playwright install --with-deps chromium
      # Найдено при A2-CLAIM-REBUILD: worker/ и scripts/ имели тесты (117 + 7),
      # но ни одна не запускалась в CI — только локально по памяти сессии.
      - run: npm run worker:test
      - run: npm run scripts:test
      # Тот же класс пробела, что закрыт для worker/ и scripts/ ранее: тесты в
      # src/ (сейчас — сверка зеркала списка юрисдикций с воркером) не запускались
      # бы в CI вообще. Добавлено вместе с самим первым таким тестом (2026-08-06,
      # D-032), чтобы он не оказался зелёным только на локальной машине.
      - run: npm run src:test
      # VITE_SCANNER_API — фиктивный, но НЕ пустой (в отличие от deploy.yml,
      # реальный бэкенд здесь не нужен и не должен быть настоящим секретом):
      # apiFetch (src/lib/scanner.ts) бросает ScannerUnavailableError ДО
      # единого fetch(), если API_BASE пуст, — а это строка, впечатанная
      # Vite в бандл на этапе сборки, рантайм её изменить не может. Пустой
      # VITE_SCANNER_API здесь означал бы, что audit-a11y ниже (блок
      # /report/:id locked/unlocked, scripts/audit-own-a11y.mjs) всегда видит
      # только панель "Scanner is not configured" — мокнутый page.route на
      # /api/scan/** никогда не сработал бы, и платный paywall-панель
      # (самая важная бизнес-поверхность продукта) осталась бы непроверенной
      # молча, зелёным CI.
      - name: Build (VITE_SCANNER_API-фикстура — иначе /report/:id в audit-a11y не рендерит paywall-панель)
        run: npm run build
        env:
          VITE_SCANNER_API: https://audit-fixture.invalid
      # Все внутренние ссылки должны разрешаться в существующие страницы
      - run: npm run check-links
      - run: npm run audit-a11y
      # Главный ответ каждого инструмента виден на телефоне без прокрутки.
      # Отдельный гейт, потому что axe и check-links этот класс регрессии
      # не видят принципиально: разметка валидна, контраст в норме, ссылки
      # целы — а число за краем экрана. За 2026-08-20 выстрелило дважды
      # (D-187), оба раза при полностью зелёных проверках.
      - run: npm run check-fold
