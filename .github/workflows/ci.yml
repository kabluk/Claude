name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Оба линтера — блокирующие шаги, до сборки (BUILD-SPEC §7)
      - run: npm run lint:upl
      - run: npm run lint:minimize
      - run: npm run typecheck
      - run: npm run build
      # Все внутренние ссылки должны разрешаться в существующие страницы
      - run: node scripts/check-links.mjs
