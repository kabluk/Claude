name: Deploy to Cloudflare Pages

# Автодеплой каталога (A0-DEPLOY, вторая половина узла — D-099).
#
# ДВА ТРИГГЕРА, и это осознанно:
#  - workflow_dispatch: ручной запуск кнопкой. Работает СЕГОДНЯ, независимо от
#    того, в какой ветке идёт работа. Рабочая ветка итерации меняется каждую
#    сессию (claude/accessatlas-*-<suffix>), завязывать деплой на её имя нельзя.
#  - push в `accessatlas`: стабильная ветка проекта. 2026-08-08 пересоздана
#    владельцем от рабочей линии (D-100) — триггер живой.
#
# ГЛАВНОЕ, ради чего узел вообще заведён (D-098): сборка ОБЯЗАНА получить
# VITE_SCANNER_API. Это переменная времени сборки; без неё фронтенд молча
# считает сканер недоступным, и на проде ломается основная функция продукта —
# ровно это и случилось при ручных деплоях. Здесь она задана явно и не может
# быть забыта.
#
# main НЕ триггерит деплой намеренно: в `main` этого репозитория живёт другой,
# несвязанный проект.

on:
  workflow_dispatch:
  push:
    branches: [accessatlas]

concurrency:
  # Параллельные деплои одного проекта Pages наступают друг другу на пятки:
  # выигрывает не последний коммит, а последний ЗАВЕРШИВШИЙСЯ билд.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Chromium СРАЗУ после npm ci, ДО worker:test — урок из ci.yml (2026-08-06,
      # A3-REFLOW/KEYBOARD/MEDIA/RESIZE/COOKIEBANNER): worker/lib/domChecks.test.mjs
      # гоняет реальный Chromium через Playwright, не мок. Этот же порядок был
      # регрессирован здесь при написании D-099 (шаг стоял только перед audit-a11y,
      # уже после worker:test) — упало живьём на первом прогоне (D-101):
      # "browserType.launch: Executable doesn't exist", чисто раннер без браузера.
      - run: npx playwright install --with-deps chromium

      # Гейты перед деплоем — не дублирование ci.yml, а защита прода: ci.yml
      # гоняется на каждый push в любую ветку, а сюда попадает только то, что
      # реально поедет пользователям. Порядок от дешёвого к дорогому.
      - run: npm run typecheck
      - run: npm run src:test
      - run: npm run scripts:test
      - run: npm run worker:test

      - name: Build (с адресом сканера — иначе сканер молча отключится, D-098)
        run: npm run build
        env:
          VITE_SCANNER_API: ${{ vars.VITE_SCANNER_API }}
          # Turnstile SITE key — ПУБЛИЧНЫЙ по дизайну (виден в клиентском бандле
          # у любого посетителя), поэтому захардкожен здесь, а не в секрете:
          # так виджет всегда в сборке и CI/ручной деплой дают одинаковый бандл
          # без ещё одной repo-переменной. Пара к нему — секрет воркера
          # TURNSTILE_SECRET_KEY (wrangler secret put, D-140). Виджет рендерят
          # ScanForm и SubscribeForm; без ключа виджет не рендерится и токена
          # нет — а воркер с секретом токен ТРЕБУЕТ (403), поэтому ключ обязан
          # быть в каждом прод-бандле (тот же класс тихого отказа, что D-098).
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEOUfpgaTq7cI0mS"

      # Проверка, что адрес сканера реально попал в бандл. Без неё пустая
      # переменная (не заданная в настройках репозитория) дала бы зелёный
      # деплой со сломанным сканером — тот самый тихий отказ из D-098.
      - name: Verify scanner API is wired into the bundle
        run: |
          if [ -z "${{ vars.VITE_SCANNER_API }}" ]; then
            echo "::error::VITE_SCANNER_API не задан (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if ! grep -rq "$(echo '${{ vars.VITE_SCANNER_API }}' | sed 's#https\?://##')" dist/assets/; then
            echo "::error::Адрес сканера не найден в собранном бандле — сканер будет недоступен на проде."
            exit 1
          fi
          echo "✓ адрес сканера присутствует в dist/assets/"

      - run: npm run check-links
      - run: npm run audit-a11y

      - name: Deploy to Cloudflare Pages
        # --branch main: production-ветка проекта Pages. Без неё деплой уходит в
        # preview, боевой URL продолжает отдавать старое (реальный прецедент,
        # D-092 — команда рапортует успех, а сайт не меняется).
        run: npx wrangler pages deploy dist --project-name verscala --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
