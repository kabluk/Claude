name: Apply D1 migrations

# D-190 (2026-08-22): применение миграций боевой D1 кнопкой, а не руками с
# CF-токеном в чате. Тот же приём и та же причина, что worker-deploy.yml
# (R-WORKER-DEPLOY, D-177): секрет живёт только в GitHub Actions и никогда не
# попадает ни в эту сессию, ни в последующие.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ WORKFLOW, а не шаг внутри worker-deploy.yml. Так решено
# осознанно и это сохранено: миграции применяются реже кода и требуют
# отдельного решения (правки схемы — только с записью в DECISIONS.md).
# Автоматический прогон при каждом code-деплое превратил бы схему в то, что
# меняется незаметно.
#
# ПОРЯДОК ВАЖЕН: сначала миграция, потом деплой воркера. Код, который читает
# новую таблицу, на старой схеме деградирует тихо (try/catch), то есть
# функция будет выглядеть работающей, ничего не делая. Обратный порядок —
# схема впереди кода — безопасен всегда: лишняя таблица никому не мешает.
#
# ⚠ У `secrets.CLOUDFLARE_API_TOKEN` может не хватать прав: он заводился под
# Cloudflare Pages, а D1 — это права уровня АККАУНТА (D1:Edit), отдельная
# политика того же токена. Если шаг ниже упадёт с ошибкой авторизации —
# нужно расширить токен в Cloudflare Dashboard либо завести новый и обновить
# секрет в Settings → Secrets and variables → Actions. Именно поэтому первым
# идёт безобидный `migrations list`: он падает на нехватке прав ДО того, как
# что-либо будет применено к боевой базе.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Что вообще ждёт применения. Заодно самая дешёвая проверка прав:
      # неавторизованный токен упадёт здесь, не тронув базу.
      - name: List pending migrations
        run: npx wrangler d1 migrations list accessatlas-scans --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        run: npx wrangler d1 migrations apply accessatlas-scans --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # После применения список обязан быть пустым — если что-то осталось,
      # значит применилось не всё, и молчаливый «успех» тут хуже красной
      # галки: следующий деплой кода уедет на неполную схему.
      - name: Verify nothing is left pending
        run: |
          out=$(npx wrangler d1 migrations list accessatlas-scans --remote 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE '\.sql'; then
            echo "::error::migrations still pending after apply — schema is incomplete"
            exit 1
          fi
          echo "✓ no pending migrations"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
