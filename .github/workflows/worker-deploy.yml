name: Deploy Worker to Cloudflare

# R-WORKER-DEPLOY (D-177, 2026-08-15): деплой воркера кнопкой, а не руками с
# CF-токеном, вставленным in-memory в чат при каждом разе (см. HANDOFF.md
# «Про CF-токены»). Секрет здесь никогда не виден ни этой сессии, ни
# последующим — только GitHub Actions, тем же путём, что CLOUDFLARE_API_TOKEN
# уже используется в deploy.yml для Cloudflare Pages.
#
# ВАЖНО (проверить перед первым живым прогоном, сделать это должен владелец,
# не сессия): secrets.CLOUDFLARE_API_TOKEN, уже настроенный для deploy.yml,
# может быть scoped ТОЛЬКО под Pages — права уровня аккаунта (Workers/D1/KV/
# Browser Rendering) и уровня зон живут в РАЗНЫХ политиках одного токена
# (см. HANDOFF.md). Если `wrangler deploy` в этом workflow упадёт с ошибкой
# авторизации — токену не хватает Workers Scripts Edit, нужен либо новый
# токен с этим правом, либо расширение существующего в Cloudflare Dashboard,
# и секрет обновляется в Settings → Secrets and variables → Actions.
#
# workflow_dispatch без branch-фильтра (как у deploy.yml) — ref выбирается
# в самом UI кнопки запуска; обычно это `accessatlas`, та же ветка, что и
# деплой сайта, но ничего не привязывает воркер именно к ней технически —
# код воркера (worker/) не завязан на конкретную ветку сайта.
#
# Миграции D1 (`npm run db:migrate:remote`) НАМЕРЕННО не входят в этот
# workflow — они применяются реже, чем код воркера, и требуют отдельного
# осознанного решения (правки схемы — только с записью в DECISIONS.md),
# не автоматического запуска при каждом code-деплое.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Гейты перед деплоем — от дешёвого к дорогому, тот же порядок, что в
      # deploy.yml.
      - run: npm run typecheck
      - run: npm run worker:test

      - name: Dry-run (catches config/auth errors before touching prod)
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # R-SMOKE-DEPLOY (D-173) уже проверяет живой прод после деплоя САЙТА —
      # здесь достаточно короткой паузы на раскатку воркера (то же 20с, что
      # deploy.yml) и минимальной живой проверки, что новая Version реально
      # встала: /api/scan/<мусорный id> обязан отвечать 404 (воркер поднялся
      # и достал до D1), а не таймаутом/5xx.
      - name: Smoke-check the deployed worker
        run: |
          sleep 20
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_ORIGIN/api/scan/00000000-0000-0000-0000-000000000000")
          if [ "$status" != "404" ]; then
            echo "::error::worker health-check got HTTP $status, expected 404 (scan not found)"
            exit 1
          fi
          echo "✓ worker responds correctly post-deploy (HTTP 404 on unknown scan id)"
        env:
          WORKER_ORIGIN: https://accessatlas-worker.zincroom.workers.dev
