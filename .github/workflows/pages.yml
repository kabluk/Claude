name: Deploy landing to GitHub Pages

# Publishes the static site in landing/ (index + subpages + app + fonts).
# One-time owner setup: repo Settings → Pages → Source: "GitHub Actions".
# After that, every push to main redeploys. Live URL: https://kabluk.github.io/Claude/

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
