[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302
  force = true
  conditions = {Language = ["ru"]}

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# Заголовки задаются файлом dist/_headers, который генерирует
# scripts/gen-sitemap.mjs после сборки: CSP включает sha256-хэши
# инлайн-скриптов vite-react-ssg, они меняются на каждой сборке.
# Дублировать их здесь нельзя — netlify.toml перекрыл бы _headers
# устаревшей CSP и сломал гидрацию.
