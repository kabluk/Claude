<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DETNAV — опрос</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14171A;--panel:#1C2126;--bezel:#2A3138;--line:#333B42;
--red:#E4382B;--yellow:#F2C230;--green:#37A05A;--blue:#5B8FB0;--ink:#EDEFF1;--dim:#868F98}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0A0C0E;font-family:Archivo,sans-serif;color:var(--ink);line-height:1.5;display:flex;justify-content:center}
.mono{font-family:'JetBrains Mono',monospace}
.app{width:100%;max-width:440px;background:var(--bg);min-height:100vh}
@media(min-width:520px){body{padding:24px 0}.app{border:1px solid var(--line);min-height:calc(100vh - 48px)}}
header{border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.2em}
.brand i{width:3px;height:14px;background:var(--red)}
.count{font-size:11px;color:var(--dim)}
.bar{display:flex;gap:3px}.seg{flex:1;height:4px;background:var(--bezel)}
.seg.on{background:var(--green)}.seg.cur{background:var(--yellow)}
main{padding:26px 18px 46px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:10px}
h1{font-size:23px;font-weight:600;line-height:1.25;margin-bottom:8px;letter-spacing:-.01em}
.hint{font-size:13.5px;color:var(--dim);margin-bottom:20px}
.reassure{font-size:12.5px;color:var(--dim);border-left:2px solid var(--yellow);padding-left:11px;margin-top:16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:none;border-left:3px solid var(--bezel);
padding:16px;margin-bottom:9px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:15.5px;font-weight:500}
.opt:hover{background:var(--bezel)}.opt.sel{border-left-color:var(--green);background:var(--bezel)}
.opt.dunno{border-left-color:var(--yellow)}
.opt small{display:block;font-size:12.5px;color:var(--dim);font-weight:400;margin-top:3px}
.nav{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:15px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);flex:0 0 92px}
.btn:disabled{background:var(--bezel);color:var(--dim);cursor:default}
.task{background:var(--panel);border-left:3px solid var(--bezel);margin-bottom:10px}
.task.now{border-left-color:var(--red)}.task.soon{border-left-color:var(--yellow)}.task.later{border-left-color:var(--green)}
.thead{width:100%;text-align:left;background:none;border:none;padding:15px 16px;cursor:pointer;
font-family:inherit;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.thead .tx{flex:1}.thead h3{font-size:15px;font-weight:600;margin-bottom:4px}
.thead p{font-size:13px;color:var(--dim)}
.badge{display:inline-block;font-size:9px;letter-spacing:.12em;font-family:'JetBrains Mono',monospace;
color:var(--blue);border:1px solid var(--blue);padding:2px 6px;margin-bottom:6px}
.chev{color:var(--dim);font-size:17px;padding-top:2px;transition:transform .18s}
.task.open .chev{transform:rotate(90deg)}
.tbody{display:none;padding:0 16px 16px}.task.open .tbody{display:block}
.tbody h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700;
margin:16px 0 8px;font-family:'JetBrains Mono',monospace}
.tbody p{font-size:13.5px;margin-bottom:9px}
.tbody ol{padding-left:20px}.tbody ol li{font-size:13.5px;margin-bottom:7px}
.say{border:1px solid var(--line);padding:13px;font-size:13.5px;line-height:1.55}
.say em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.14em;color:var(--dim);
margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.warnbox{border-left:3px solid var(--yellow);background:var(--bezel);padding:11px 13px;font-size:13px}
.formbox{border-left:3px solid var(--green);background:var(--bezel);padding:11px 13px;font-size:13px}
.srcbox{border-left:3px solid var(--blue);background:var(--bezel);padding:11px 13px;font-size:13px}
.srcbox div{margin-bottom:7px}.srcbox div:last-child{margin-bottom:0}
.srcbox b{display:block;font-weight:600;margin-bottom:1px}
.srcbox span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);word-break:break-all}
.why{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;padding-top:10px;
border-top:1px solid var(--line);margin-top:14px}
.grp{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700;
margin:26px 0 11px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.note{border:1px dashed var(--line);padding:15px;margin-top:24px}
.note h3{font-size:14px;font-weight:600;margin-bottom:6px}.note p{font-size:12.5px;color:var(--dim)}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
@media print{body{background:#fff;color:#000}header,.nav,.chev{display:none}.tbody{display:block!important}
.task{border:1px solid #000;break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
 <header><div class="top"><div class="brand"><i></i>DETNAV</div><div class="count mono" id="count"></div></div>
 <div class="bar" id="bar"></div></header><main id="main"></main>
</div>
<script>
const S=a=>a.role==="self";
const Q=[
{id:"role",b:0,bn:"Рамка",q:()=>"Вы заполняете за себя или за другого человека?",

{id:"state",b:0,bn:"Рамка",q:a=>S(a)?"Что у вас сейчас?":"Что произошло?",

 o:a=>S(a)?[{v:"nothing",t:"Пока ничего"},{v:"case",t:"Есть открытое дело в суде"},{v:"before",t:"Задерживали раньше, сейчас на свободе"}]
 :[{v:"nothing",t:"Пока ничего не случилось"},{v:"just",t:"Задержали сегодня или вчера"},
   {v:"found",t:"Уже нашли в системе"},{v:"court",t:"Уже было слушание"}]},

{id:"anum",b:1,bn:"Опознание",q:a=>S(a)?"Знаете ли вы свой A-Number?":"Известен ли его A-Number?",

 o:[{v:"yes",t:"Да, знаю"},{v:"find",t:"Нет, но документы дома есть"},{v:"no",t:"Нет и документов нет"},{v:"what",t:"Не знаю, что это",d:1}]},

 w:a=>!S(a),o:[{v:"all",t:"Всё знаю"},{v:"part",t:"Знаю частично"},{v:"no",t:"Почти ничего",d:1}]},

{id:"years",b:2,bn:"Связи",q:a=>S(a)?"Сколько лет вы в США?":"Сколько лет он в США?",

 o:[{v:"lt1",t:"Меньше года"},{v:"1_5",t:"От года до пяти"},{v:"5_10",t:"От пяти до десяти"},
    {v:"gt10",t:"Больше десяти"},{v:"dunno",t:"Не знаю",d:1}]},
{id:"home",b:2,bn:"Связи",q:a=>S(a)?"Договор аренды или собственность оформлены на вас?":"На кого оформлено жильё?",
 h:"Договор аренды и счета показывают, что у человека есть постоянное жильё. Это одно из того, что смотрит судья при решении о залоге.",
 o:a=>S(a)?[{v:"me",t:"Да, на меня"},{v:"other",t:"Нет, на другого человека"},{v:"none",t:"Договора нет"},{v:"dunno",t:"Не знаю",d:1}]
 :[{v:"him",t:"На него"},{v:"me",t:"На меня"},{v:"both",t:"На обоих"},{v:"none",t:"Договора нет"},{v:"dunno",t:"Не знаю",d:1}]},
{id:"usfam",b:2,bn:"Связи",q:a=>S(a)?"Есть ли у вас в США близкие с гражданством или грин-картой?":"Есть ли у него в США близкие с гражданством или грин-картой?",

{id:"sponsor",b:3,bn:"Залог",q:a=>S(a)?"Есть ли рядом человек с гражданством США или грин-картой, который смог бы внести за вас залог?":"Есть ли рядом человек с гражданством США или грин-картой, готовый внести залог?",
 h:"Сам за себя задержанный залог внести не может. Обязателем могут быть также юрфирмы и некоммерческие организации. Само право на слушание о залоге сейчас оспаривается — это отдельный вопрос к адвокату.",
 o:[{v:"yes",t:"Да, есть кого назвать"},{v:"maybe",t:"Возможно, надо поговорить"},{v:"no",t:"Таких людей нет"},{v:"dunno",t:"Не знаю",d:1}]},

 o:[{v:"yes",t:"Да"},{v:"no",t:"Нет"},{v:"dunno",t:"Не знаю",d:1}]},
{id:"school",b:4,bn:"Кто зависит",q:a=>S(a)?"Указан ли в школе кто-то ещё, кроме вас?":"Указан ли в школе кто-то ещё, кроме него?",
 h:"Если в школе записан один взрослый, ребёнка не отдадут никому другому — даже бабушке.",
 w:a=>a.kids==="yes",o:[{v:"yes",t:"Да, есть второй человек"},{v:"only",t:"Только один"},{v:"dunno",t:"Не знаю",d:1}]},
{id:"guard",b:4,bn:"Кто зависит",q:()=>"Есть ли взрослый, готовый взять заботу о детях?",
 h:"Важно, чтобы этот человек сам имел статус и не находился под угрозой задержания.",
 w:a=>a.kids==="yes",o:[{v:"status",t:"Да, и у него есть статус"},{v:"nostatus",t:"Да, но сам без статуса"},
 {v:"no",t:"Нет такого человека"},{v:"dunno",t:"Не знаю",d:1}]},

 h:"Уход за пожилыми и больными прерывается в тот же день. Об этом обычно забывают.",

 o:[{v:"yes",t:"Да"},{v:"no",t:"Нет"},{v:"dunno",t:"Не знаю",d:1}]},
{id:"hipaa",b:5,bn:"Здоровье",q:a=>S(a)?"Может ли кто-то из близких говорить с вашими врачами?":"Может ли кто-то из близких говорить с его врачами?",
 h:"Для этого нужна подписанная форма доступа к медицинской информации.",
 o:[{v:"yes",t:"Да, оформлено"},{v:"no",t:"Нет"},{v:"dunno",t:"Не знаю",d:1}]},

{id:"sole",b:6,bn:"Что рассыплется",q:a=>S(a)?"Оформлено ли что-то важное только на вас: машина, счёт, аренда, бизнес?"
 :"Оформлено ли что-то важное только на него: машина, счёт, аренда, бизнес?",

{id:"pay",b:6,bn:"Что рассыплется",q:a=>S(a)?"Есть ли у вас обязательные регулярные платежи?":"Есть ли у него обязательные регулярные платежи?",
 h:"Просрочки начинаются молча. Через несколько недель машину увозят на штрафстоянку, а жильё теряют.",

 o:[{v:"yes",t:"Да"},{v:"no",t:"Нет"},{v:"dunno",t:"Не знаю",d:1}]},

{id:"phones",b:6,bn:"Что рассыплется",q:a=>S(a)?"Помните ли вы наизусть хотя бы один нужный номер телефона?"

 o:[{v:"yes",t:"Да"},{v:"no",t:"Нет"},{v:"dunno",t:"Не знаю",d:1}]},

ev_years:{ev:1,h:"Соберите доказательства лет, прожитых в США",p:"Чем длиннее непрерывная линия, тем лучше.",
 why:"Длительность проживания — отдельный фактор в перечне. Подтверждается не одним документом, а множеством мелких. Главное правило: любой год закрывается любым документом, где есть имя человека и дата. Не нужен «правильный» документ — нужен хоть один на каждый год.",
 how:["Идите по годам, а не по типам документов","На каждый год — минимум один документ с именем и датой","Договоры аренды, счета, медицинские и школьные записи","Банковские выписки и переводы","Фотографии с датами, если больше ничего нет"],

bond_first:{h:"Сначала выясните, будет ли вообще слушание о залоге",p:"Право на него сейчас оспаривается в судах.",
 why:"С июля 2025 власти считают, что человек, вошедший в страну без проверки, подлежит обязательному задержанию и залога не имеет. Федеральные апелляционные суды разошлись: Второй, Третий, Шестой и Одиннадцатый округа с этим не согласились, Пятый и Восьмой поддержали позицию властей. Пятый округ — это Техас, Луизиана и Миссисипи, куда чаще всего перевозят людей. Пересмотр в Верховном суде ожидается. Итог: ответ зависит от того, где человека держат, и меняется при переводе в другой штат.",
 how:["Задайте адвокату этот вопрос первым, до всего остального","Уточните, в каком округе находится учреждение","Спросите, что изменится, если человека переведут в другой штат","Только после этого решайте, искать ли обязателя"],
 warn:"Определить, относится ли это к конкретному человеку, может только адвокат. Здесь описано состояние спора на июль 2026 года — оно меняется быстро, проверяйте дату."},
sponsor_ready:{h:"Подготовьте документы будущего обязателя",p:"Ему понадобится подтверждение статуса.",
 why:"Вносить залог может гражданин США или обладатель грин-карты от 18 лет, а также юрфирмы и некоммерческие организации.",
 how:["Паспорт США, свидетельство о рождении или грин-карта","Совпадение имени в документе, банковском счёте и профиле","Готовность к оплате переводом"]},
sponsor_talk:{h:"Поговорите с возможным обязателем заранее",p:"Разговор тяжёлый, начинать лучше не в день слушания.",
 why:"Людей с подходящим статусом в окружении обычно единицы, и просьба серьёзная — поэтому её откладывают до последнего.",
 how:["Объясните, что деньги возвращаются в конце дела","Скажите честно: это может занять годы","Предупредите, что понадобятся его документы","Дайте время подумать"],
 say:"Мне нужно попросить о серьёзном. Чтобы человека выпустили, залог должен внести гражданин или обладатель грин-карты — я этого сделать не могу. Деньги возвращаются после окончания дела, но это может занять долгое время. Я пойму любой ответ. Можно я объясню, как это устроено?",
 warn:"Не обещайте сроков возврата — они не зависят ни от вас, ни от него."},
bondfund:{h:"Посмотрите фонды залога",p:"Некоммерческие организации могут выступать обязателем.",
 why:"Если подходящих людей нет, обязателем может быть организация. Для многих это единственный путь.",
 how:["Ищите фонды, работающие в этом штате","Уточните, берут ли они это учреждение","Спросите про очередь и условия","Проверьте организацию по тем же реестрам, что и адвоката"],
 warn:"Состав фондов меняется, часть закрывается. Убедитесь, что организация работает сейчас."},

school_add:{h:"Добавьте второго человека в школе",p:"Сейчас забирать ребёнка имеет право только один взрослый.",
 why:"Школа отдаёт ребёнка только тем, кто указан в её карточке. Решается заявлением в офис и не требует суда.",
 how:["Придите в офис школы лично","Попросите форму authorized pickup или emergency contact","Возьмите документ с фотографией","Попросите копию заполненной формы себе","Отдельно укажите, кому отдавать нельзя"],
 say:"Здравствуйте. Я хочу добавить человека в список тех, кто может забирать ребёнка, и обновить контакты для экстренной связи. Подскажите, какую форму заполнить."},
caregiver:{h:"Оформите документ на заботу о детях",p:"Родственник получает право водить в школу и к врачу без суда.",
 why:"В Калифорнии Caregiver's Authorization Affidavit даёт родственнику право записывать ребёнка в школу и давать согласие на медицинскую помощь. Опека через суд не нужна.",
 form:"Это установленная законом форма. Мы её не составляем — берите официальный бланк. Родительских прав она не отнимает.",
 warn:"За пределами Калифорнии порядок другой. Проверьте правила своего штата."},
caregiver_risk:{h:"Найдите для детей взрослого со статусом",p:"Опекун не должен сам находиться под угрозой задержания.",
 why:"Если человек, назначенный заботиться о детях, сам без статуса, план может рухнуть в тот же день. Организации рекомендуют выбирать гражданина или обладателя грин-карты.",
 how:["Составьте список подходящих взрослых","Поговорите заранее, не ставьте перед фактом","Убедитесь, что он знает, где документы","Дайте ему выучить нужные телефоны"]},
dep_plan:{h:"Продумайте, кто позаботится о зависимых",p:"Пожилые и больные остаются без ухода в тот же день.",
 why:"Планы подготовки обычно строят вокруг детей, а взрослые на попечении выпадают. Уход прерывается сразу.",

meds_list:{h:"Составьте список лекарств",p:"Названия и дозировки, а не «таблетки от давления».",
 why:"В учреждении нужно точно назвать препараты. Перерыв в приёме — реальный риск для здоровья.",
 how:["Полные названия и дозировки","Контакты лечащих врачей","Диагнозы, если есть документы","Копию носить с собой и оставить доверенному человеку"]},
hipaa:{h:"Оформите доступ к медицинской информации",p:"Без него родственник не сможет говорить с врачами.",
 why:"Подписанная форма HIPAA даёт доверенному человеку право получать медицинские записи и общаться с врачами. Это нужно и для здоровья, и как доказательство для дела.",
 form:"Бланк даёт медицинское учреждение, форма стандартная. Мы её не составляем."},

poa:{h:"Разберитесь с доверенностью",p:"Один документ закрывает машину, счёт и договоры.",
 why:"Имущество, оформленное на одного человека, становится недоступно остальным. Машину не продать, счётом не распорядиться, договор не переоформить.",
 form:"Доверенность — юридический документ. Мы его не составляем и не даём образцов. Оформляется у нотариуса или по официальной форме штата. Если человек уже задержан — порядок подписания другой, это вопрос к адвокату.",
 how:["Определите, что именно нужно закрыть","Уточните, принимает ли банк или ведомство свою форму","Сделайте копии и скажите, где оригинал"]},
payments:{h:"Составьте список обязательных платежей",p:"С датами и суммами. Кто-то должен их закрыть.",
 why:"Просрочки начинаются молча: аренда, кредит за машину, страховка. Через несколько недель машину эвакуируют, а жильё теряют.",
 how:["Выпишите все регулярные платежи с датами","Отметьте, откуда они списываются","Отметьте, у кого есть доступ к этим деньгам","Начните с ближайшего по дате"]},
phones:{h:"Выучите наизусть два номера телефона",p:"Телефон забирают первым.",
 why:"Организации помощи ставят это одним из первых пунктов: без выученного номера человек в учреждении не может позвонить никому, даже имея право на звонок.",
 how:["Один номер близкого человека","Второй — адвоката или организации","Проверьте, что помните их без подсказки","Запишите также на бумаге и держите отдельно от телефона"]},

docs_gather:{h:"Соберите документы в одну папку",p:"И сделайте копии.",

copies_trusted:{h:"Отдайте копии доверенному человеку",p:"Оригиналы держите отдельно.",
 why:"Организации советуют хранить копии там, где к ним есть доступ у надёжного человека, если вас не будет.",
 how:["Выберите человека, который сам не под угрозой","Передайте копии и скажите, где оригиналы","Продублируйте в облако"],
 warn:"План и документы не носят с собой. Хранить в безопасном месте, местоположение сообщать только доверенным людям."},

trusted_setup:{h:"Договоритесь с доверенным человеком",p:"Не «кому позвонить», а кто возьмётся действовать.",
 why:"Собранные бумаги ничего не стоят, если никто не знает, что они существуют и где лежат. Задержание происходит внезапно, и дальше действует не тот, кого забрали, а тот, кто остался.",
 how:["Выберите человека, который сам не под угрозой задержания","Покажите ему, где лежат документы и копии","Дайте ему выучить ваш A-Number","Договоритесь, кому он звонит первым","Скажите, кто заберёт детей и кто знает про лекарства"],
 say:"Хочу попросить тебя об одном на всякий случай. Если со мной что-то случится и я перестану выходить на связь — вот где лежат мои документы, вот кому надо позвонить. Надеюсь, не понадобится. Можно я покажу?",
 warn:"План и документы не носите с собой. Хранить в надёжном месте, а где именно — знают только доверенные люди."},
trusted_find:{h:"Найдите человека, который будет действовать",p:"Пока такого нет, вся подготовка держится на вас одном.",
 why:"Если никто не знает о вашей ситуации, то в первые сутки после задержания не произойдёт ничего: вас не будут искать, документы никто не достанет, детей никто не заберёт.",
 how:["Подойдут коллега, сосед, человек из общины или прихода","Не обязательно родственник и не обязательно близкий друг","Главное — что он согласен и сам не под угрозой","Достаточно одного человека, но лучше двух"]},
court_dates:{h:"Держите даты слушаний под контролем",p:"Пропуск слушания — самая частая необратимая потеря.",
 why:"Если человек не пришёл на назначенное слушание, дело может быть решено без него и заочно. Чаще всего это происходит не из-за побега, а из-за смены адреса: уведомление уходит на старый.",
 how:["Проверьте дату своего слушания в официальной системе","Поставьте напоминания за 14, 3 и 1 день","При переезде подайте смену адреса в суд отдельной формой EOIR-33","Сохраните подтверждение подачи"],
 src:[["Проверка даты слушания","acis.eoir.justice.gov"],["Форма смены адреса","justice.gov/eoir/form-eoir-33"]]},
prior_case:{h:"Достаньте документы прошлого дела",p:"Что было раньше, определяет очень многое.",
 why:"Прошлое задержание или закрытое дело оставляет след в системе, и адвокату нужны документы, а не воспоминания. Это первое, о чём он спросит.",
 how:["Все уведомления и решения по прошлому делу","Номер прошлого дела, если сохранился","Если бумаг нет — запрос в суд или через адвоката","Сфотографируйте всё, что найдёте"],
 warn:"Не обсуждайте прошлые дела по записанной телефонной линии из учреждения. Это тема для разговора с адвокатом."},
connect:{h:"Наладьте связь и деньги на звонки",p:"Два способа оплаты, и разница в цене существенная.",
 why:"Звонить внутрь нельзя — звонит только он. Пока на счету нет денег, связи нет вообще. Регулярный тёплый контакт — то, что сильнее всего защищает человека внутри.",
 how:["Узнайте, какой оператор связи в этом учреждении","Вариант 1: пополнить личный баланс задержанного — он звонит куда захочет","Вариант 2: привязать счёт к вашему номеру — звонки только вам, обычно дешевле","На всех отправлениях указывайте A-Number"],
 src:[["Приложения операторов","GettingOut · Securus · ConnectNetwork"],["Письма и открытки в учреждения","pigeon.ly"]],
 form:"Важно про пополнение: в приложении GettingOut положить деньги нельзя — приложение показывает баланс и сообщения, но оплата в нём не работает. Пополнять надо через сайт оператора в браузере, с компьютера или телефона. У других операторов бывает так же — если в приложении нет кнопки оплаты, ищите сайт, а не переустанавливайте приложение.",
 warn:"Книги — только новые и напрямую от магазина или издателя, не от частного лица. Мягкая обложка проходит быстрее: твёрдую проверяют дольше и часто не пропускают. Правила у каждого учреждения свои — подтвердите по телефону перед отправкой."},
support:{h:"Разделите нагрузку и держитесь людей",p:"Страх и бессонница здесь — нормальная реакция.",

function rules(a){
 const T=[],add=(p,k,why)=>T.push({p,k,why});
 const urgent=a.state==="just"||a.state==="found"||a.state==="court";

 if(a.anum==="yes") add("now","anum_have","номер известен");
 if(a.anum==="find"||a.anum==="what") add("now","anum_find","документы дома есть");
 if(a.anum==="no") add("now",urgent?"anum_ask":"anum_find","номера нет");
 if(a.idb==="part"||a.idb==="no") add("now","idb","данных для поиска не хватает");

 if(urgent){add("now","nosign","человека уже задержали");add("now","verify","человека уже задержали");
  add("now","connect","человека уже задержали")}
 add(urgent?"now":"soon","freehelp","нужна правовая оценка");
 if(urgent&&a.role==="other") add("later","support","дело идёт долго");

 if(a.trusted==="yes") add("soon","trusted_setup","доверенный человек есть");
 if(a.trusted==="maybe"||a.trusted==="dunno") add("now","trusted_setup","договорённости нет");
 if(a.trusted==="no") add("now","trusted_find","действовать за вас некому");
 if(a.state==="case"||a.state==="court") add("now","court_dates","дело в суде идёт");
 if(a.state==="before") add("soon","prior_case","задерживали раньше");

 if(a.home==="him"||a.home==="me"||a.home==="both"||a.home==="other") add("soon","ev_home","есть договор на жильё");
 if(a.home==="none") add("soon","ev_home","договора нет — нужны другие подтверждения адреса");
 if(a.years&&a.years!=="dunno") add("soon","ev_years","длительность проживания");
 if(a.usfam==="close"||a.usfam==="other") add("soon","ev_family","есть родственники со статусом");
 if(a.work==="official") add("soon","ev_work_off","официальная работа");
 if(a.work==="cash") add("soon","ev_work_cash","работа за наличные");
 if(a.work==="own") add("soon","ev_work_own","своё дело");
 if(a.courts==="came"||a.courts==="missed") add("soon","ev_courts","были назначения в суд");
 if(a.crim==="docs"||a.crim==="nodocs") add("now","ev_crim","были аресты");

 add("now","bond_first","право на залог сейчас оспаривается");
 if(a.sponsor==="yes") add("soon","sponsor_ready","обязатель есть");
 if(a.sponsor==="maybe"||a.sponsor==="dunno") add("now","sponsor_talk","обязатель под вопросом");
 if(a.sponsor==="no") add("now","bondfund","подходящих людей нет");

 if(a.school==="only"||a.school==="dunno") add("now","school_add","в школе указан только один взрослый");
 if(a.guard==="status") add("soon","caregiver","есть взрослый со статусом");
 if(a.guard==="nostatus"||a.guard==="no") add("now","caregiver_risk","опекун сам под риском или его нет");
 if(a.dep==="yes") add("soon","dep_plan","есть зависимые кроме детей");

 if(a.meds==="yes"){add("now","meds_list","принимает лекарства");}
 if(a.meds==="yes"&&a.hipaa!=="yes") add("soon","hipaa","доступ к врачам не оформлен");

 if(a.sole==="yes") add("soon","poa","имущество на одном человеке");
 if(a.pay==="yes") add("now","payments","есть регулярные платежи");
 if(a.phones!=="yes") add("now","phones","телефоны не выучены");

 if(a.docs==="have"||a.docs==="know") add("soon","docs_gather","документы есть");
 if(a.docs==="no"||a.docs==="dunno") add("soon","docs_gather","документов не найти");
 if(a.copies!=="yes") add("soon","copies_trusted","копий у доверенного нет");

 const o={now:0,soon:1,later:2};
 return T.filter((t,i,s)=>s.findIndex(x=>x.k===t.k)===i).sort((x,y)=>o[x.p]-o[y.p]);
}

let ans={},i=0,fin=false,op={};
const vis=()=>Q.filter(q=>!q.w||q.w(ans));
const opts=q=>typeof q.o==="function"?q.o(ans):q.o;

function segs(){const v=vis(),bs=[...new Set(v.map(q=>q.b))],c=v[i]?v[i].b:99;
 return bs.map(b=>{const qs=v.filter(q=>q.b===b);
 return qs.every(q=>ans[q.id]!==undefined)?"on":(b===c?"cur":"")})}

function render(){
 const v=vis();
 document.getElementById('bar').innerHTML=segs().map(c=>`<div class="seg ${c}"></div>`).join('');
 document.getElementById('count').textContent=fin?"готово":`${Math.min(i+1,v.length)} / ${v.length}`;
 if(fin)return res();
 const q=v[i];
 document.getElementById('main').innerHTML=`<div class="eyebrow">${q.bn}</div><h1>${q.q(ans)}</h1>
 ${q.h?`<p class="hint">${q.h}</p>`:'<div style="height:12px"></div>'}
 ${opts(q).map(o=>`<button class="opt ${o.d?'dunno':''} ${ans[q.id]===o.v?'sel':''}"
  onclick="pick('${q.id}','${o.v}')">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}
   ${opts(q).some(o=>o.d)?'<p class="reassure">Не знаете — так и отвечайте. Это нормальный ответ, он тоже превратится в задачу.</p>':''}
 <div class="nav">${i>0?`<button class="btn ghost" onclick="prev()">Назад</button>`:''}
 <button class="btn" onclick="next()" ${ans[q.id]===undefined?'disabled':''}>Дальше</button></div>`;
 window.scrollTo(0,0);
}
function pick(id,v){ans[id]=v;render()}
function prev(){if(i>0){i--;render()}}
function next(){const v=vis();if(i<v.length-1)i++;else fin=true;render()}
function again(){ans={};i=0;fin=false;op={};render()}
function tog(k){op[k]=!op[k];res()}

function res(){
 const T=rules(ans),g={now:"Сейчас",soon:"На этой неделе",later:"Когда будет время"};
 let h=`<div class="eyebrow">Ваш список</div><h1>${T.length} задач</h1>
 <p class="hint">Собран из ваших ответов. Ничего не ушло на наш сервер — список живёт только в этом браузере. Нажмите на задачу, чтобы раскрыть.</p>`;
 ["now","soon","later"].forEach(p=>{
  const l=T.filter(t=>t.p===p);if(!l.length)return;
  h+=`<div class="grp">${g[p]}</div>`;
  h+=l.map(t=>{const d=D[t.k];let b=`<div class="tbody">`;
   if(d.why)b+=`<h4>Зачем</h4><p>${d.why}</p>`;
   if(d.how)b+=`<h4>Как</h4><ol>${d.how.map(s=>`<li>${s}</li>`).join('')}</ol>`;
   if(d.src)b+=`<h4>Где именно взять</h4><div class="srcbox">${d.src.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;
   if(d.say)b+=`<h4>Что сказать</h4><div class="say"><em>ОБРАЗЕЦ · МЕНЯЙТЕ ПОД СЕБЯ</em>${d.say}</div>`;
   if(d.form)b+=`<h4>Форма</h4><div class="formbox">${d.form}</div>`;
   if(d.warn)b+=`<h4>Внимание</h4><div class="warnbox">${d.warn}</div>`;
   b+=`<div class="why">почему в списке: ${t.why}</div></div>`;
   return `<div class="task ${p} ${op[t.k]?'open':''}"><button class="thead" onclick="tog('${t.k}')">
   <span class="tx">${d.ev?'<span class="badge">ДОКАЗАТЕЛЬСТВО</span><br>':''}<h3>${d.h}</h3><p>${d.p}</p></span>
   <span class="chev">›</span></button>${b}</div>`}).join('');
 });
 h+=`<div class="note"><h3>Про пометку «доказательство»</h3>
 <p>Так отмечены задачи из перечня факторов, которые, согласно опубликованному решению BIA, рассматриваются при решении о залоге: адрес, срок проживания, семейные связи, работа, явки в суд, судимости. Мы не оцениваем ваше положение и не предсказываем исход — только перечисляем, что обычно подтверждают документами.</p></div>
 <div class="note"><h3>Дальше — вопросы для адвоката</h3>
 <p>Год и способ въезда, прошлые дела и приказы, прошлые задержания. Эти ответы не выводятся на экран и не дают никаких выводов — они попадают только в PDF, который вы отдадите адвокату.</p></div>
 <div class="nav"><button class="btn" onclick="window.print()">Скачать список</button>
 <button class="btn ghost" onclick="again()">Заново</button></div>
 <p class="foot">Мы не адвокаты и не даём юридических консультаций. Это список дел, а не правовая позиция. Образцы — бытовая переписка; юридические документы мы не составляем.</p>`;
 document.getElementById('main').innerHTML=h;
}
render();
</script>
