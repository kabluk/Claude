    approval_required: true
    notes: "Закрыто 2026-08-06 (D-020, D-021): владелец явно одобрил ANTHROPIC_API_KEY отдельно от CF-одобрения A1-SCAN (правило сработало как задумано). Live-прогон настоящим ключом через `wrangler dev --local --var` (ключ передан только как аргумент процесса, нигде не записан на диск и не закоммичен) вскрыл РЕАЛЬНЫЙ баг: Claude Haiku оборачивает JSON в markdown code fence несмотря на промпт «ONLY a JSON object» — parseExplainResponse падал на JSON.parse, каждый cache-miss отдавал 502. Ни одна прежняя синтетическая фикстура это не покрывала. Исправлено (stripCodeFence), 5 новых фикстур в explain.test.mjs — 39/39 worker-тестов зелёные. Живьём подтверждены все документированные пути: happy path, cache hit, abstention, 400, 503. Отдельно: тот же ключ загружен как настоящий Worker secret (`wrangler secret put`) на реальный деплой A1-SCAN и подтверждён живым запросом — объяснение для `landmark-one-main` (ровно то правило, что реально нашёл живой скан example.com) пришло реальное и по делу. Замечено: сразу после `secret put` часть запросов ещё получала 503 (секрет не пропагировался мгновенно на все edge-узлы Cloudflare) — не баг, обычная эксплуатационная задержка распространения секрета по глобальной сети, самостоятельно прошла за секунды."

