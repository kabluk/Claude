  - id: A1-EXPLAIN
    title: AI-пояснения находок (Claude Haiku + KV-кэш ruleId×locale)
    owner: backend-engineer
    status: done
    depends_on: [A1-SCAN]
    inputs: [docs/project/DECISIONS.md, docs/project/INTERFACES.md]
