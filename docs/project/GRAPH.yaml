  - id: A2-STRIPE-WEBHOOK-CODE
    title: "Обработчик POST /api/stripe-hook: проверка подписи + обновление featured, тесты на синтетических фикстурах Stripe-событий"
    owner: backend-engineer
    status: done
    depends_on: [A2-STRIPE-SCHEMA]
    inputs: [docs/project/INTERFACES.md]
    scope: [worker/routes/stripeHook.js, worker/lib/stripeSig.js]
