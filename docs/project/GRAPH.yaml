    verify:
      - npm run worker:test
      - "проверка подписи webhook отклоняет поддельное событие (тест на синтетическом секрете, НЕ реальном)"
      - "checkout.session.completed → featured.until обновляется в D1 (локально)"
    max_attempts: 4
    attempts: 1
    risk: medium
    approval_required: false
    notes: "Готово 2026-08-06. worker/lib/stripeSig.js::verifyStripeSignature — реальный алгоритм Stripe (Stripe-Signature: t=…,v1=…, HMAC-SHA256 через Web Crypto secret над \"{t}.{raw_body}\", константное по времени сравнение, поддержка нескольких v1 при ротации секрета, 5-минутный tolerance на timestamp против replay). worker/routes/stripeHook.js: секрет — env.STRIPE_WEBHOOK_SECRET (НЕ STRIPE_SECRET_KEY, тот не нужен этому узлу вовсе), нет секрета → 503 (тот же паттерн, что ANTHROPIC_API_KEY в A1-EXPLAIN); подпись считается по СЫРОМУ телу (request.text(), не request.json()); agency_slug/until извлекаются из checkout.session.completed → session.metadata (единственный канал протащить нашу бизнес-данные через Stripe Checkout — реальную настройку Payment Link с этими полями делает A2-STRIPE-LIVE); апсерт в featured через `INSERT ... ON CONFLICT(agency_slug) DO UPDATE` (agency_slug PK из A2-STRIPE-SCHEMA — продление, не новая строка); любое подтверждённое-по-подписи событие (в т.ч. необрабатываемый тип, в т.ч. валидное событие с некорректной/пустой metadata) отвечает 200, чтобы Stripe не ретраил то, что мы осознанно не обрабатываем — retry имеет смысл только для реальных сбоев доставки, не для 'мы это не парсим'. 24 новых юнит-теста (worker/lib/stripeSig.test.mjs — 11, worker/routes/stripeHook.test.mjs — 13), 89/89 worker:test зелёные, все на синтетическом секрете whsec_test_..., подписи для тестов строятся через node:crypto createHmac НЕЗАВИСИМО от crypto.subtle, которым пользуется сам модуль — проверяет совместимость с реальным алгоритмом Stripe, не то, что код согласен сам с собой. typecheck и `wrangler deploy --dry-run` чистые. Живой прогон через `wrangler dev --local --var STRIPE_WEBHOOK_SECRET:whsec_local_synthetic_dev_secret` + `wrangler d1 execute --local` на реальной локальной D1 (не мок): поддельная подпись (чужой secret) → 400, D1 не тронута; отсутствующий заголовок Stripe-Signature → 400; валидное событие → 200, реальная строка появилась в featured (agency_slug/until/stripe_ref все верные); второе checkout.session.completed для того же agency_slug (продление, новый until) → тот же agency_slug, until обновился на новый, вторая строка НЕ появилась (ON CONFLICT реально сработал в настоящей SQLite/D1, не только по тексту SQL) — тестовая строка удалена после проверки. Разблокировало A2-STRIPE-LIVE (approval_required остаётся true — не снимается этим узлом)."

