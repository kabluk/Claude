и и сможете распределять задачи по семье."]}},q2:{t:"Есть ли у человека A-Number?",why:"Это главный номер для поиска человека в системе. Его первым спросит и адвокат.",o:{yes:["Да","Отлично. Впишите его позже в план — тогда в кризис этот шаг уже будет сделан."],no:["Нет","Ничего страшного: человека ищут по фамилии и дате рождения, просто это дольше."],unsure:["Не уверен(а)","Это 7–9 цифр рядом с буквой A в любых иммиграционных документах или старых повестках. Можно посмотреть позже."]}},q3:{t:"Как человек въехал в США?",why:"Это одна из первых вещей, которые спросит адвокат. Мы просто записываем ответ и не делаем из него выводов о деле.",o:{visa:["По визе","Въезд через официальный пункт: аэропорт, граница с печатью в паспорте."],ewi:["Без документов","Пересечение границы вне официального пункта."],unknown:["Не знаю / не хочу отвечать","Можно пропустить. Адвокат уточнит это сам при разговоре."]}},q4:{t:"Есть ли в США человек, который сможет вести процесс?",why:"Этот человек получит инструкции, если кнопка будет нажата. Без него план работает иначе.",o:{relative:["Да, родственник","Он станет «ответственным №1»: увидит все шаги и прогресс семьи."],friend:["Да, друг/знакомый/община","Подходит любой, кому вы доверяете. Родственник не обязателен."],abroad:["Родные только в другой стране","Они тоже подходят: смогут координировать удалённо. Мы добавим шаг про консульство."],none:["Никого","Тогда план строится вокруг вас: бумажная инструкция, бесплатные звонки из места содержания, консульство."]}},q5:{t:"Если понадобится адвокат — как с оплатой?",why:"От ответа зависит, кого мы предложим звонить: частного адвоката или бесплатные организации.",o:{yes:["Сможем оплатить","Ориентир: частные адвокаты обычно берут несколько тысяч долларов. Мы покажем, как проверить адвоката перед оплатой."],partial:["Частично","Покажем и частных, и бесплатные варианты про запас."],no:["Нет","Есть бесплатные юридические организации — покажем список для вашего региона. Честно: у них очереди, звоните в несколько сразу."]}},q6:{t:"Есть ли дети или люди на вашем иждивении?",why:"В кризис про них нужно решить в первые часы — кто заберёт, кто присмотрит.",o:{yes:["Да","Добавим шаг «кто забирает детей» и отдельный список документов по каждому ребёнку."],no:["Нет","Пропустим эти шаги, план будет короче."]}},q7:{t:"Адвокат уже выбран?",why:"Если адвокат есть — его звонок будет одним из первых шагов. Если нет — поможем найти и проверить.",o:{yes:["Да","Запишите его телефон позже в план. Он попадёт в инструкции близким."],no:["Нет","Не проблема. Добавим шаг: как найти и проверить по официальному реестру, и как не попасть на мошенника."]}},q8:{t:"Есть ли заявление в процессе (убежище и т.п.)?",why:"Организации публикуют предупреждения о рисках поездок для таких людей — покажем их вам с датой и источником.",o:{yes:["Да","Покажем опубликованные предупреждения. Вашу ситуацию стоит обсудить с адвокатом."],no:["Нет / не знаю","Пропускаем, ничего не потеряете."]}}},boosters:{anumber:"Впишите A-Number",contact:"Добавьте ответственного №1 (телефон)",attorney:"Запишите контакт адвоката",verify:"Пройдите Scam Shield: проверка помощника",docs:"Соберите документы по вашему списку",paper:"Скачайте бумажный план",consulate:"Запишите телефон консульства",probono:"Сохраните 3–5 бесплатных организаций региона",kids:"Назначьте, кто забирает детей"}}},Ng={_meta:Pg,app:jg},Ig={status:"DRAFT — pending human content review",content_version:1},$g={common:{step:"Step {{n}} of {{total}}",next:"Continue",back:"Back"},login:{title:"Your phone number",lead:"We'll text you a code. No passwords — they're easy to forget under stress.",get_code:"Get code",have_account:"I already have an account",code_sent:"We sent a 6-digit code to",resend:"Resend code",resend_in:"Resend code (0:{{sec}})",sign_in:"Sign in",header:"Sign in"},today:{day_chip:"Day 1 of the crisis",family_footer:"Completed by Marina · visible to all 3 family members"},alerts:{title:"Three types — three reactions",lead:"The family shouldn't flinch at every push notification.",header:"Notifications"},panic:{title:"If they come — one tap",lead:"Your family gets the alert and your action plan. Card data is stored only on this phone.",button:"ALERT",hint_idle:"tap if a detention has started",hint_cancel:"tap again to cancel",sent:"SENT",hint_sent:"your family received the alert and plan",footer:"Sign-in uses a numeric code, not a fingerprint — a code can't be compelled",header:"Preparedness mode"},docs:{title:"Documents by year",lead:"Document completeness is the first thing attorneys ask for. Tap a cell.",header:"Documents",cat_taxes:"Taxes",cat_housing:"Housing",cat_school:"School",cat_finance:"Finance",legend_full:"have it",legend_part:"partial",legend_none:"missing",export_pdf:"Build PDF packet for attorney",note:'"Completeness" is not an assessment of the case. Only your attorney can assess it.'},quiz:{title:"Your readiness plan",why_footer:"Every answer changes your plan: which steps, documents, and people it includes. We don't ask anything extra.",skip:"Skip this question",skip_hint:"You can come back later. The plan will still work, just less precisely.",step:"Question {{n}} of {{total}}",readiness:"Plan readiness",readiness_note:"This is the readiness of your PLAN, not an assessment of your case. The alert button always works, even if you fill in nothing.",your_plan:"Your plan type",next_steps_title:"What strengthens the plan",done:"Plan assembled",plans:{FAMILY:"Family plan",FAMILY_NM:"Family plan · free legal help",REMOTE:"Plan with relatives abroad",PROXY:"Plan via a trusted person",SOLO:"Personal plan (solo)"},q:{q1:{t:"Who is this plan for?",why:"This decides whose phone holds the alert button and who receives instructions.",o:{self:["For myself","The button lives on your phone. If something happens, the plan launches for your loved ones."],family:["For a loved one","You'll run the process: you'll get instructions and can assign tasks to the family."]}},q2:{t:"Does the person have an A-Number?",why:"This is the main number used to find someone in the system. An attorney asks for it first, too.",o:{yes:["Yes","Great. Add it to your plan later — that step will already be done in a crisis."],no:["No","That's okay: people can be found by name and date of birth, it just takes longer."],unsure:["Not sure","It's 7–9 digits next to the letter A on any immigration documents or old hearing notices. You can check later."]}},q3:{t:"How did the person enter the U.S.?",why:"This is one of the first things an attorney will ask. We only record the answer — we draw no conclusions about the case.",o:{visa:["On a visa","Entry through an official port: airport, border crossing with a passport stamp."],ewi:["Without documents","Crossing the border outside an official port of entry."],unknown:["Don't know / prefer not to say","You can skip this. The attorney will clarify it in conversation."]}},q4:{t:"Is there someone in the U.S. who can run the process?",why:"This person receives instructions if the button is pressed. Without them, the plan works differently.",o:{relative:["Yes, a relative","They become 'responsible person #1': they see all steps and family progress."],friend:["Yes, a friend/community member","Anyone you trust works. It doesn't have to be a relative."],abroad:["Relatives are only abroad","That works too: they can coordinate remotely. We'll add a consulate step."],none:["No one","Then the plan is built around you: a paper instruction, free calls from the facility, the consulate."]}},q5:{t:"If an attorney is needed — what about payment?",why:"The answer decides who we suggest calling: a private attorney or free organizations.",o:{yes:["We can pay","For context: private attorneys usually charge several thousand dollars. We'll show how to verify an attorney before paying."],partial:["Partially","We'll show both private and free options as backup."],no:["No","Free legal organizations exist — we'll show a list for your region. Honestly: they have waitlists, so call several at once."]}},q6:{t:"Are there children or dependents?",why:"In a crisis this must be decided within hours — who picks them up, who watches them.",o:{yes:["Yes","We'll add a 'who picks up the kids' step and a separate document list per child."],no:["No","We'll skip those steps; the plan will be shorter."]}},q7:{t:"Has an attorney been chosen?",why:"If there's an attorney, calling them is one of the first steps. If not — we'll help find and verify one.",o:{yes:["Yes","Add their phone to the plan later. It goes into the instructions for loved ones."],no:["No","No problem. We'll add a step: how to find and verify one via the official registry, and how to avoid scammers."]}},q8:{t:"Is there a pending application (asylum, etc.)?",why:"Organizations publish travel-risk warnings for such people — we'll show them with dates and sources.",o:{yes:["Yes","We'll show published warnings. Your situation is worth discussing with an attorney."],no:["No / not sure","Skipping — you lose nothing."]}}},boosters:{anumber:"Add the A-Number",contact:"Add responsible person #1 (phone)",attorney:"Save the attorney's contact",verify:"Use Scam Shield: verify any helper",docs:"Gather documents from your list",paper:"Download the paper plan",consulate:"Save the consulate phone",probono:"Save 3–5 free organizations in your region",kids:"Assign who picks up the children"}}},Lg={_meta:Ig,app:$g},Dg={status:"BORRADOR — pendiente de revisión humana",content_version:1},Ug={common:{step:"Paso {{n}} de {{total}}",next:"Continuar",back:"Atrás"},login:{title:"Su número de teléfono",lead:"Le enviaremos un código por SMS. Sin contraseñas — son fáciles de olvidar bajo estrés.",get_code:"Recibir código",have_account:"Ya tengo una cuenta",code_sent:"Enviamos un código de 6 dígitos a",resend:"Reenviar código",resend_in:"Reenviar código (0:{{sec}})",sign_in:"Entrar",header:"Entrar"},today:{day_chip:"Día 1 de la crisis",family_footer:"Completado por Marina · visible para los 3 miembros de la familia"},alerts:{title:"Tres tipos — tres reacciones",lead:"La familia no debe sobresaltarse con cada notificación.",header:"Notificaciones"},panic:{title:"Si llegan — un toque",lead:"Su familia recibirá la señal y su plan de acción. Los datos se guardan solo en este teléfono.",button:"ALERTA",hint_idle:"toque si comenzó una detención",hint_cancel:"toque de nuevo para cancelar",sent:"ENVIADO",hint_sent:"su familia recibió la señal y el plan",footer:"El acceso es con código numérico, no con huella — un código no se puede exigir por la fuerza",header:"Modo de preparación"},docs:{title:"Documentos por año",lead:"La completitud de documentos es lo primero que piden los abogados. Toque una celda.",header:"Documentos",cat_taxes:"Impuestos",cat_housing:"Vivienda",cat_school:"Escuela",cat_finance:"Finanzas",legend_full:"sí",legend_part:"parcial",legend_none:"no",export_pdf:"Armar paquete PDF para el abogado",note:"La «completitud» no es una evaluación del caso. Solo su abogado puede evaluarlo."},quiz:{title:"Su plan de preparación",why_footer:"Cada respuesta cambia su plan: qué pasos, documentos y personas incluye. No preguntamos nada de más.",skip:"Saltar esta pregunta",skip_hint:"Puede volver después. El plan funcionará igual, solo menos preciso.",step:"Pregunta {{n}} de {{total}}",readiness:"Preparación del plan",readiness_note:"Esto es la preparación del PLAN, no una evaluación de su caso. El botón de alerta funciona siempre, aunque no llene nada.",your_plan:"Su tipo de plan",next_steps_title:"Qué fortalece el plan",done:"Plan listo",plans:{FAMILY:"Plan familiar",FAMILY_NM:"Plan familiar · ayuda legal gratuita",REMOTE:"Plan con familiares en el extranjero",PROXY:"Plan con persona de confianza",SOLO:"Plan personal (solo)"},q:{q1:{t:"¿Para quién es este plan?",why:"De esto depende en qué teléfono estará el botón de alerta y quién recibirá las instrucciones.",o:{self:["Para mí mismo(a)","El botón estará en su teléfono. Si algo sucede, el plan se activa para sus seres queridos."],family:["Para un ser querido","Usted dirigirá el proceso: recibirá instrucciones y podrá repartir tareas en la familia."]}},q2:{t:"¿La persona tiene un A-Number?",why:"Es el número principal para encontrar a alguien en el sistema. El abogado también lo pide primero.",o:{yes:["Sí","Muy bien. Agréguelo al plan después — en una crisis ese paso ya estará hecho."],no:["No","No pasa nada: se puede buscar por apellido y fecha de nacimiento, solo toma más tiempo."],unsure:["No estoy seguro(a)","Son 7–9 dígitos junto a la letra A en cualquier documento de inmigración o citaciones viejas. Puede revisarlo después."]}},q3:{t:"¿Cómo entró la persona a EE. UU.?",why:"Es una de las primeras cosas que preguntará el abogado. Solo anotamos la respuesta — no sacamos conclusiones sobre el caso.",o:{visa:["Con visa","Entrada por un punto oficial: aeropuerto, cruce fronterizo con sello en el pasaporte."],ewi:["Sin documentos","Cruce de la frontera fuera de un punto oficial."],unknown:["No sé / prefiero no decir","Puede saltarlo. El abogado lo aclarará en la conversación."]}},q4:{t:"¿Hay alguien en EE. UU. que pueda dirigir el proceso?",why:"Esta persona recibirá instrucciones si se presiona el botón. Sin ella, el plan funciona diferente.",o:{relative:["Sí, un familiar","Será el «responsable n.° 1»: verá todos los pasos y el progreso de la familia."],friend:["Sí, un amigo/conocido/comunidad","Sirve cualquier persona de confianza. No tiene que ser familiar."],abroad:["Familiares solo en el extranjero","También sirve: pueden coordinar a distancia. Añadiremos un paso del consulado."],none:["Nadie","Entonces el plan se arma alrededor de usted: instrucción en papel, llamadas gratis desde el centro, el consulado."]}},q5:{t:"Si se necesita abogado — ¿cómo con el pago?",why:"La respuesta define a quién sugerimos llamar: abogado privado u organizaciones gratuitas.",o:{yes:["Podemos pagar","Como referencia: los abogados privados suelen cobrar varios miles de dólares. Mostraremos cómo verificar al abogado antes de pagar."],partial:["Parcialmente","Mostraremos opciones privadas y gratuitas como respaldo."],no:["No","Existen organizaciones legales gratuitas — mostraremos la lista de su región. Siendo honestos: tienen lista de espera, llame a varias a la vez."]}},q6:{t:"¿Hay niños o personas a su cargo?",why:"En una crisis esto se decide en las primeras horas: quién los recoge, quién los cuida.",o:{yes:["Sí","Añadiremos el paso «quién recoge a los niños» y una lista de documentos por cada niño."],no:["No","Saltamos esos pasos; el plan será más corto."]}},q7:{t:"¿Ya tiene abogado elegido?",why:"Si hay abogado, llamarlo es uno de los primeros pasos. Si no — ayudamos a encontrar y verificar.",o:{yes:["Sí","Anote su teléfono en el plan después. Entrará en las instrucciones de los seres queridos."],no:["No","No hay problema. Añadiremos el paso: cómo buscar y verificar en el registro oficial, y cómo no caer con estafadores."]}},q8:{t:"¿Hay una solicitud en trámite (asilo, etc.)?",why:"Las organizaciones publican avisos sobre riesgos de viaje para estas personas — se los mostraremos con fecha y fuente.",o:{yes:["Sí","Mostraremos los avisos publicados. Su situación conviene hablarla con un abogado."],no:["No / no sé","Lo saltamos, no pierde nada."]}}},boosters:{anumber:"Anote el A-Number",contact:"Agregue al responsable n.° 1 (teléfono)",attorney:"Guarde el contacto del abogado",verify:"Use Scam Shield: verifique a cualquier «ayudante»",docs:"Reúna los documentos de su lista",paper:"Descargue el plan en papel",consulate:"Guarde el teléfono del consulado",probono:"Guarde 3–5 organizaciones gratuitas de su región",kids:"Designe quién recoge a los niños"}}},zg={_meta:Dg,app:Ug},Fg={status:"ЧЕРНОВИК — требуется проверка контента человеком (раздел 12.4)",content_version:1,review_notes:"Весь информационный текст должен быть проверен иммиграционным адвокатом перед публикацией."},Bg={what_happened:{title:"Что случилось?",option_crisis:"Близкий человек задержан",option_prepared:"Хочу подготовиться заранее",option_have_attorney:"У нас уже есть адвокат — нужно собрать документы"},q1_know_location:{title:"Вы знаете, где они находятся?",yes:"Да",no:"Нет"},q2_a_number:{title:"У вас есть их A-Number?",yes:"Да",no:"Нет",what_is_that:"Что это?",explainer:"A-Number (регистрационный номер иностранца) — это номер из 7–9 цифр, который присваивает правительство. На документах он указан как буква «A» и цифры.",image_alt:"Пример того, где на документе указан A-Number"},q3_years_in_us:{title:"Сколько лет они живут в США?",lt2:"Меньше 2 лет",y2_10:"2–10 лет",gt10:"Больше 10 лет"},today_tasks:{title:"Ваши 3 задачи на сегодня",progress_label:"Прогресс за сегодня",collapse_72h:"Дальше: 72 часа",collapse_weeks:"Первые недели"},save_prompt:{title:"Сохранить ваш план?",body:"Создайте бесплатный аккаунт, чтобы прогресс сохранился и семья могла присоединиться.",continue_email:"Продолжить с email",continue_apple:"Продолжить с Apple",continue_google:"Продолжить с Google",later:"Не сейчас"}},Mg="Только информационный инструмент. Не является юридической фирмой и не заменяет адвоката.",qg={_meta:Fg,onboarding:Bg,disclaimer:Mg},Hg={status:"DRAFT — pending human content review (spec 12.4)",content_version:1,review_notes:"All guidance copy must be reviewed by an immigration attorney before release. Source links to be filled per section."},Wg={what_happened:{title:"What happened?",option_crisis:"A loved one was detained",option_prepared:"I want to be prepared in advance",option_have_attorney:"We already have an attorney — I need to organize documents"},q1_know_location:{title:"Do you know where they are?",yes:"Yes",no:"No"},q2_a_number:{title:"Do you have their A-Number?",yes:"Yes",no:"No",what_is_that:"What is that?",explainer:'An A-Number (Alien Registration Number) is a 7–9 digit number the government assigns. It appears on immigration documents as "A" followed by digits.',image_alt:"Example of where the A-Number appears on a document"},q3_years_in_us:{title:"How many years have they lived in the U.S.?",lt2:"Under 2 years",y2_10:"2–10 years",gt10:"More than 10 years"},today_tasks:{title:"Your 3 tasks for today",progress_label:"Today's progress",collapse_72h:"Next: 72 hours",collapse_weeks:"First weeks"},save_prompt:{title:"Save your plan?",body:"Create a free account so your progress is kept and family can join.",continue_email:"Continue with email",continue_apple:"Continue with Apple",continue_google:"Continue with Google",later:"Not now"}},Vg="Informational tool only. Not a law firm and not a substitute for an attorney.",Kg={_meta:Hg,onboarding:Wg,disclaimer:Vg},Gg={status:"ЧЕРНОВИК — требуется проверка контента человеком",content_version:1,review_notes:"По одной записи на каждый checklist_steps.key. phase: 1=24ч, 2=72ч, 3=недели."},Jg={locate:{title:"Найдите их",summary:"Как пошагово пользоваться открытым правительственным поиском задержанных.",body:"Открытый поиск — это правительственный сайт, доступный всем. Введите A-Number как 9 цифр, без дефисов и без буквы в начале, и выберите страну рождения. Если имя в старых документах написано иначе, попробуйте и это написание — имена, перенесённые из другого алфавита, часто записаны по-разному. Иногда поиск просит позвонить в ведомство или не находит ничего; такое бывает и само по себе не подтверждает, где человек находится.",source_url:"TODO: официальный URL поиска"},three_rules:{title:"Три правила",summary:"Общая информация, которую семьи часто зачитывают вслух во время первого звонка.",body:"ЧЕРНОВИК — здесь будет общая информация с источниками после проверки.",source_url:"TODO"},money_calls:{title:"Деньги и звонки",summary:"Как открыть телефонный счёт в учреждении.",body:"Учреждения работают с внешними операторами телефонных счетов. Есть два типа счетов: один пополняет личный баланс задержанного, другой привязан к конкретному номеру родственника. Семьи часто их путают. На странице вашего учреждения в приложении указано, какого оператора оно использует и что оплачивает каждый счёт.",source_url:"TODO: страница оператора для каждого учреждения"},mail_format:{title:"Формат почты",summary:"Как оформить конверт, чтобы письмо дошло.",body:"Учреждения обычно требуют полное имя и A-Number на конверте. Перед отправкой проверьте точный формат на странице вашего учреждения.",source_url:null},attorney_verification:{title:"Проверка лицензии адвоката",summary:"Как семьи проверяют лицензию по открытым реестрам.",body:"Коллегия адвокатов каждого штата ведёт бесплатный открытый поиск, где можно проверить статус и историю лицензии. Федеральный список также называет практиков, дисциплинарно наказанных в иммиграционной сфере. Иммиграционный суд обычно принимает адвокатов с лицензией любого штата; для подачи документов в федеральный окружной суд обычно требуется допуск именно этого округа. Это общая информация, а не оценка конкретного адвоката.",source_url:"TODO: URL федерального списка"},start_documents:{title:"Начните собирать документы",summary:"Документы, подтверждающие годы проживания, — одно из первых, что просят адвокаты.",body:"Семьи в такой ситуации обычно собирают документы по годам: налоговые декларации, договоры аренды, школьные и медицинские документы, выписки из банка, расчётные листы, удостоверения личности и фотографии. «Конструктор документов» помогает собрать то, что может попросить адвокат.",source_url:null},support_letters:{title:"Письма поддержки",summary:"Отслеживайте письма от людей, которые знают вашу семью.",body:"Адвокаты иногда просят семьи собрать письма от работодателей, учителей, соседей или общины. Приложение только отмечает, кого вы попросили и пришло ли письмо, — содержанием руководит ваш адвокат.",source_url:null},children_care:{title:"Документы об уходе за детьми",summary:"Соберите контакты опекунов, информацию о школе и важные документы.",body:"Запишите, кто сейчас заботится о детях, запасных опекунов, контакты школы, и сохраните документы: свидетельства о рождении, страховые карты. По судебным вопросам суды каждого штата публикуют официальные материалы для самопомощи — мы даём только ссылки на них.",source_url:"TODO: каталог self-help по штатам"},send_securely:{title:"Как безопасно передать документы",summary:"Делитесь документами через закрытые ссылки, а не через почту или мессенджеры.",body:"Адвокаты обычно просят не отправлять документы по email, SMS или в мессенджерах. Используйте временную ссылку в этом приложении или загрузите пакет в портал, который даст ваш адвокат.",source_url:null}},Yg="Полнота документов",Qg={_meta:Gg,navigator:Jg,coverage_meter_label:Yg},Xg={status:"DRAFT — pending human content review",content_version:1,review_notes:"One entry per checklist_steps.key. phase: 1=24h, 2=72h, 3=weeks."},Zg={locate:{title:"Find them",summary:"How to use the public government detainee locator, step by step.",body:"The public locator is a government website open to everyone. Enter the A-Number as 9 digits, with no dashes and no letter prefix, and select the country of birth. If the name was written differently on older documents, try that spelling too — names transliterated from another alphabet are often recorded in more than one way. Sometimes the locator returns a message asking you to call the agency for details, or returns nothing at all; this happens and does not by itself confirm where a person is.",source_url:"TODO: official locator URL"},three_rules:{title:"Three rules",summary:"General information families commonly read aloud during the first phone call.",body:"DRAFT — general-information content with sources; reviewed copy goes here.",source_url:"TODO"},money_calls:{title:"Money and calls",summary:"Setting up a phone account at the facility.",body:"Facilities use outside vendors for phone accounts. There are two account types: one funds the detained person's own calling balance, and another is tied to a specific family phone number. Families commonly confuse the two. Your facility's page in this app lists which vendor it uses and what each account funds.",source_url:"TODO: vendor page per facility record"},mail_format:{title:"Mail format",summary:"How to address envelopes so mail reaches them.",body:"Facilities commonly require the full committed name and the A-Number on the envelope. Check your facility's page for its exact format before sending anything.",source_url:null},attorney_verification:{title:"Check an attorney's license",summary:"How families verify a license using public records.",body:"Every state bar keeps a free public search where you can look up a lawyer's license status and history. A federal list also names practitioners disciplined in immigration practice. Immigration court generally accepts attorneys licensed in any state; filings in federal district court generally require admission to that district. This is general information, not a judgment about any specific attorney.",source_url:"TODO: federal disciplined-practitioners list URL"},start_documents:{title:"Start gathering documents",summary:"Documents proving years of residence are among the first things attorneys request.",body:"Families in this situation commonly gather documents year by year: tax records, leases, school records, medical records, bank statements, pay stubs, IDs, and photos. The Document Builder helps you organize what an attorney may ask for.",source_url:null},support_letters:{title:"Support letters",summary:"Keep track of letters from people who know your family.",body:"Attorneys sometimes ask families to collect letters from employers, teachers, neighbors, or faith communities. This app only tracks who you asked and whether the letter arrived — your attorney guides the content.",source_url:null},children_care:{title:"Children's care documentation",summary:"Organize caregiver contacts, school info, and key documents.",body:"Record who is caring for the children now, backup caregivers, school contacts, and store documents like birth certificates and insurance cards. For court-related questions, each state court system publishes official self-help resources — we link to them and give no other guidance.",source_url:"TODO: per-state self-help directory"},send_securely:{title:"How to send documents securely",summary:"Share documents through private links, not email or messengers.",body:"Attorneys commonly ask clients not to send documents by email, text, or messenger. Use this app's expiring share link, or upload your packet to the portal your attorney gives you.",source_url:null}},em="Document coverage",tm={_meta:Xg,navigator:Zg,coverage_meter_label:em},nm={status:"ЧЕРНОВИК — требуется проверка человеком (все три языка)",content_version:1},rm={title:"День вашего слушания",when_where:{title:"Когда и где",open_maps:"Открыть в картах",copy_address:"Скопировать адрес",tz_note:"Часовой пояс суда: {{tz}} (ваш: {{local_tz}})"},leave_by:{title:"Когда выезжать",travel_mode:"Как вы добираетесь?",drive:"На машине",transit:"Общественный транспорт",dropped_off:"Меня подвезут",origin:"Откуда выезжаете",travel_minutes:"Время в пути (минуты)",buffer:"Запас на парковку, досмотр и поиск зала: {{minutes}} мин",arithmetic:"Путь ~{{travel}} + {{buffer}} мин запаса → выезд в {{time}}",edit_estimate:"Изменить оценку"},bring:{title:"Что взять с собой",id:"Документы каждого, кто идёт",notice:"Повестка на слушание",attorney:"Имя и телефон адвоката",interpreter:"Язык переводчика",docs:"Документы, которые просил адвокат",parking:"Деньги на парковку",kids:"Еда и тихие занятия (если с вами дети)"},practical:{title:"Уточните в суде заранее",log_call:"Записать этот звонок",unverified:"Для этого суда не подтверждено — позвоните и уточните",q_phones:"Можно ли проносить телефоны в здание?",q_parking:"Парковка: где и сколько стоит?",q_children:"Можно ли детей в зал?",q_access:"Вопросы доступности",q_late:"Что делать, если опаздываете?",q_checkin:"Где отметиться?"},reminders:{title:"Напоминания",add_calendar:"Добавить в календарь (.ics)"},dayof:{title:"Карточка дня",offline_note:"Этот экран работает без интернета."},disclaimer:"Только практическая информация. Обо всём, что касается самого слушания, спрашивайте своего адвоката."},sm={title:"Сколько это обычно длится?",card:"Среди всех дел {{custody}} в этом суде за {{period}} половина завершилась за {{median}} дней или быстрее, а половина длилась дольше.",iqr:"Средняя половина дел длилась {{p25}}–{{p75}} дней.",national:"К делу пока не привязан суд — показываем общенациональные цифры.",sample:"На основе {{n}} дел. Публикация данных: {{release}}. Источник: {{source}}.",caveat:"Это исторические данные о многих делах, а не прогноз по вашему. Сроки отдельных дел сильно различаются.",detained:"с задержанием",not_detained:"без задержания"},im={_meta:nm,hearing_day:rm,timing:sm},om={status:"DRAFT — pending human content review (all three locales)",content_version:1},am={title:"Your hearing day",when_where:{title:"When and where",open_maps:"Open in maps",copy_address:"Copy address",tz_note:"Court time zone: {{tz}} (yours: {{local_tz}})"},leave_by:{title:"When to leave",travel_mode:"How are you getting there?",drive:"Drive",transit:"Public transit",dropped_off:"Someone drops me off",origin:"Your starting point",travel_minutes:"Travel time (minutes)",buffer:"Buffer for parking, security, and finding the room: {{minutes}} min",arithmetic:"Travel ~{{travel}} + {{buffer}} min buffer → leave by {{time}}",edit_estimate:"Edit this estimate"},bring:{title:"What to bring",id:"ID for each person attending",notice:"Hearing notice",attorney:"Attorney's name and phone",interpreter:"Interpreter language",docs:"Documents your attorney asked for",parking:"Money for parking",kids:"Snacks and quiet activities (if children are coming)"},practical:{title:"Confirm with the court in advance",log_call:"Log this call",unverified:"Not confirmed for this court — call to check",q_phones:"Are phones allowed in the building?",q_parking:"Parking: where and how much?",q_children:"Are children allowed in the courtroom?",q_access:"Accessibility needs",q_late:"What to do if running late?",q_che
