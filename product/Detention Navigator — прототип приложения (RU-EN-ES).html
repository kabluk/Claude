открыть телефонный счёт в учреждении.",body:"Учреждения работают с внешними операторами телефонных счетов. Есть два типа счетов: один пополняет личный баланс задержанного, другой привязан к конкретному номеру родственника. Семьи часто их путают. На странице вашего учреждения в приложении указано, какого оператора оно использует и что оплачивает каждый счёт.",source_url:"TODO: страница оператора для каждого учреждения"},mail_format:{title:"Формат почты",summary:"Как оформить конверт, чтобы письмо дошло.",body:"Учреждения обычно требуют полное имя и A-Number на конверте. Перед отправкой проверьте точный формат на странице вашего учреждения.",source_url:null},attorney_verification:{title:"Проверка лицензии адвоката",summary:"Как семьи проверяют лицензию по открытым реестрам.",body:"Коллегия адвокатов каждого штата ведёт бесплатный открытый поиск, где можно проверить статус и историю лицензии. Федеральный список также называет практиков, дисциплинарно наказанных в иммиграционной сфере. Иммиграционный суд обычно принимает адвокатов с лицензией любого штата; для подачи документов в федеральный окружной суд обычно требуется допуск именно этого округа. Это общая информация, а не оценка конкретного адвоката.",source_url:"TODO: URL федерального списка"},start_documents:{title:"Начните собирать документы",summary:"Документы, подтверждающие годы проживания, — одно из первых, что просят адвокаты.",body:"Семьи в такой ситуации обычно собирают документы по годам: налоговые декларации, договоры аренды, школьные и медицинские документы, выписки из банка, расчётные листы, удостоверения личности и фотографии. «Конструктор документов» помогает собрать то, что может попросить адвокат.",source_url:null},support_letters:{title:"Письма поддержки",summary:"Отслеживайте письма от людей, которые знают вашу семью.",body:"Адвокаты иногда просят семьи собрать письма от работодателей, учителей, соседей или общины. Приложение только отмечает, кого вы попросили и пришло ли письмо, — содержанием руководит ваш адвокат.",source_url:null},children_care:{title:"Документы об уходе за детьми",summary:"Соберите контакты опекунов, информацию о школе и важные документы.",body:"Запишите, кто сейчас заботится о детях, запасных опекунов, контакты школы, и сохраните документы: свидетельства о рождении, страховые карты. По судебным вопросам суды каждого штата публикуют официальные материалы для самопомощи — мы даём только ссылки на них.",source_url:"TODO: каталог self-help по штатам"},send_securely:{title:"Как безопасно передать документы",summary:"Делитесь документами через закрытые ссылки, а не через почту или мессенджеры.",body:"Адвокаты обычно просят не отправлять документы по email, SMS или в мессенджерах. Используйте временную ссылку в этом приложении или загрузите пакет в портал, который даст ваш адвокат.",source_url:null}},rp="Полнота документов",lp={_meta:tp,navigator:np,coverage_meter_label:rp},op={status:"DRAFT — pending human content review",content_version:1,review_notes:"One entry per checklist_steps.key. phase: 1=24h, 2=72h, 3=weeks."},ip={locate:{title:"Find them",summary:"How to use the public government detainee locator, step by step.",body:"The public locator is a government website open to everyone. Enter the A-Number as 9 digits, with no dashes and no letter prefix, and select the country of birth. If the name was written differently on older documents, try that spelling too — names transliterated from another alphabet are often recorded in more than one way. Sometimes the locator returns a message asking you to call the agency for details, or returns nothing at all; this happens and does not by itself confirm where a person is.",source_url:"TODO: official locator URL"},three_rules:{title:"Three rules",summary:"General information families commonly read aloud during the first phone call.",body:"DRAFT — general-information content with sources; reviewed copy goes here.",source_url:"TODO"},money_calls:{title:"Money and calls",summary:"Setting up a phone account at the facility.",body:"Facilities use outside vendors for phone accounts. There are two account types: one funds the detained person's own calling balance, and another is tied to a specific family phone number. Families commonly confuse the two. Your facility's page in this app lists which vendor it uses and what each account funds.",source_url:"TODO: vendor page per facility record"},mail_format:{title:"Mail format",summary:"How to address envelopes so mail reaches them.",body:"Facilities commonly require the full committed name and the A-Number on the envelope. Check your facility's page for its exact format before sending anything.",source_url:null},attorney_verification:{title:"Check an attorney's license",summary:"How families verify a license using public records.",body:"Every state bar keeps a free public search where you can look up a lawyer's license status and history. A federal list also names practitioners disciplined in immigration practice. Immigration court generally accepts attorneys licensed in any state; filings in federal district court generally require admission to that district. This is general information, not a judgment about any specific attorney.",source_url:"TODO: federal disciplined-practitioners list URL"},start_documents:{title:"Start gathering documents",summary:"Documents proving years of residence are among the first things attorneys request.",body:"Families in this situation commonly gather documents year by year: tax records, leases, school records, medical records, bank statements, pay stubs, IDs, and photos. The Document Builder helps you organize what an attorney may ask for.",source_url:null},support_letters:{title:"Support letters",summary:"Keep track of letters from people who know your family.",body:"Attorneys sometimes ask families to collect letters from employers, teachers, neighbors, or faith communities. This app only tracks who you asked and whether the letter arrived — your attorney guides the content.",source_url:null},children_care:{title:"Children's care documentation",summary:"Organize caregiver contacts, school info, and key documents.",body:"Record who is caring for the children now, backup caregivers, school contacts, and store documents like birth certificates and insurance cards. For court-related questions, each state court system publishes official self-help resources — we link to them and give no other guidance.",source_url:"TODO: per-state self-help directory"},send_securely:{title:"How to send documents securely",summary:"Share documents through private links, not email or messengers.",body:"Attorneys commonly ask clients not to send documents by email, text, or messenger. Use this app's expiring share link, or upload your packet to the portal your attorney gives you.",source_url:null}},up="Document coverage",sp={_meta:op,navigator:ip,coverage_meter_label:up},ap={status:"ЧЕРНОВИК — требуется проверка человеком (все три языка)",content_version:1},cp={title:"День вашего слушания",when_where:{title:"Когда и где",open_maps:"Открыть в картах",copy_address:"Скопировать адрес",tz_note:"Часовой пояс суда: {{tz}} (ваш: {{local_tz}})"},leave_by:{title:"Когда выезжать",travel_mode:"Как вы добираетесь?",drive:"На машине",transit:"Общественный транспорт",dropped_off:"Меня подвезут",origin:"Откуда выезжаете",travel_minutes:"Время в пути (минуты)",buffer:"Запас на парковку, досмотр и поиск зала: {{minutes}} мин",arithmetic:"Путь ~{{travel}} + {{buffer}} мин запаса → выезд в {{time}}",edit_estimate:"Изменить оценку"},bring:{title:"Что взять с собой",id:"Документы каждого, кто идёт",notice:"Повестка на слушание",attorney:"Имя и телефон адвоката",interpreter:"Язык переводчика",docs:"Документы, которые просил адвокат",parking:"Деньги на парковку",kids:"Еда и тихие занятия (если с вами дети)"},practical:{title:"Уточните в суде заранее",log_call:"Записать этот звонок",unverified:"Для этого суда не подтверждено — позвоните и уточните",q_phones:"Можно ли проносить телефоны в здан
